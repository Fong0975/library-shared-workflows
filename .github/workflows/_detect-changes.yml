name: Detect changes

# Normalizes the caller's `projects` list (fills in per-language defaults) and
# decides which projects and optional stages are affected by the changed paths.
# Filtering happens here rather than in the caller's `on.*.paths` so that
# unaffected checks report as "skipped" (which satisfies required status checks)
# instead of never starting.
#
# - pull_request: projects and extra filters follow the PR's changed paths; a PR
#   that edits a workflow file selects everything.
# - push: every project is checked, while extra filters (post-merge stages such
#   as swagger and the version bump) follow the pushed commits, and
#   `dependency-update` tells whether the push only updated dependencies.
# - any other event (e.g. workflow_dispatch): everything is selected.

on:
  workflow_call:
    inputs:
      projects:
        description: JSON array of project definitions (see README).
        type: string
        required: true
      ignore-paths:
        description: JSON array of glob patterns that never trigger any check.
        type: string
        required: true
      extra-filters:
        description: >-
          JSON object mapping a filter name to its glob patterns; each result is
          exposed as a boolean in the `extra` output.
        type: string
        default: "{}"
      dependency-paths:
        description: >-
          JSON array of dependency manifest globs; a push that changes nothing else
          counts as a dependency update. "[]" leaves only the Dependabot check.
        type: string
        default: "[]"
    # Callers build their matrix from the name lists and look each project up in
    # `projects-by-name`, so matrix values (and thus job names) stay short.
    outputs:
      node-names:
        description: JSON array with the names of the node projects to check.
        value: ${{ jobs.detect.outputs.node-names }}
      go-names:
        description: JSON array with the names of the go projects to check.
        value: ${{ jobs.detect.outputs.go-names }}
      projects-by-name:
        description: JSON object mapping every project name to its normalized definition.
        value: ${{ jobs.detect.outputs.projects-by-name }}
      any:
        description: '"true" when any non-ignored file changed.'
        value: ${{ jobs.detect.outputs.any }}
      extra:
        description: JSON object mapping each extra filter name to true/false.
        value: ${{ jobs.detect.outputs.extra }}
      dependency-update:
        description: >-
          "true" when a push only updates dependencies: every pushed commit was
          authored by Dependabot, or only `dependency-paths` files changed.
        value: ${{ jobs.detect.outputs.dependency-update }}

permissions:
  contents: read

# Explicit bash enables `-o pipefail`; the implicit default shell is `bash -e`.
defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node-names: ${{ steps.select.outputs.node-names }}
      go-names: ${{ steps.select.outputs.go-names }}
      projects-by-name: ${{ steps.select.outputs.projects-by-name }}
      any: ${{ steps.select.outputs.any }}
      extra: ${{ steps.select.outputs.extra }}
      dependency-update: ${{ steps.select.outputs.dependency-update }}
    steps:
      - name: Normalize projects
        id: normalize
        env:
          PROJECTS: ${{ inputs.projects }}
          IGNORE_PATHS: ${{ inputs.ignore-paths }}
          EXTRA_FILTERS: ${{ inputs.extra-filters }}
          DEPENDENCY_PATHS: ${{ inputs.dependency-paths }}
        run: |
          projects=$(jq -c '
            def under($dir; $file): if $dir == "." then $file else "\($dir)/\($file)" end;

            def defaults($language; $dir):
              if $language == "node" then {
                install: "npm ci",
                format: "npm run format:check",
                lint: "npm run lint",
                typecheck: "npm run typecheck",
                test: "npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=test-results.json",
                build: "npm run build",
                "node-version-file": under($dir; ".nvmrc"),
                cache: "npm",
                "cache-dependency-path": under($dir; "package-lock.json"),
                "test-results": "test-results.json",
                "coverage-file": "coverage/coverage-summary.json",
                env: {}
              }
              elif $language == "go" then {
                format: "",
                lint: "",
                typecheck: "",
                "golangci-lint": "latest",
                "golangci-lint-args": "--timeout=5m",
                test: "go test ./... -v -race -coverprofile=coverage.out 2>&1 | tee test-output.txt",
                build: "go build ./...",
                "go-version-file": under($dir; "go.mod"),
                "cache-dependency-path": under($dir; "go.sum"),
                "test-results": "test-output.txt",
                "coverage-file": "coverage.out",
                env: { CGO_ENABLED: "1" }
              }
              else error("unsupported language \"\($language)\" (expected node or go)")
              end
              + { "coverage-threshold": 0, "coverage-exclude": "" };

            if type != "array" or length == 0 then error("projects must be a non-empty JSON array") else . end
            | map(
                if (.name | type) != "string" or (.name | test("^[A-Za-z0-9_-]+$") | not)
                then error("every project needs a name made of letters, digits, \"-\" or \"_\"")
                else . end
                | . as $p
                | ($p.dir // "." | ltrimstr("./") | rtrimstr("/") | if . == "" then "." else . end) as $dir
                | defaults($p.language; $dir) as $d
                | $d + { paths: [under($dir; "**")] } + $p
                | .dir = $dir
                | .env = ($d.env + ($p.env // {}))
                | .paths |= (if type == "string" then [.] else . end)
              )
            | if (map(.name) | unique | length) != length then error("project names must be unique") else . end
          ' <<<"$PROJECTS")

          # paths-filter treats every pattern of a filter as a required match
          # (predicate-quantifier: every), so all include patterns are folded into
          # one brace pattern and the exclusions follow as negated patterns.
          # `non_dependency` matches any file outside the dependency manifests, so
          # it staying unchanged means the push only touched dependencies.
          filters=$(jq -c --argjson ignore "$IGNORE_PATHS" --argjson extra "$EXTRA_FILTERS" \
            --argjson deps "$DEPENDENCY_PATHS" '
            def rules($paths):
              ($paths | map(select(startswith("!") | not))) as $include
              | if ($include | length) == 0 then error("every filter needs at least one include pattern") else . end
              | [ if ($include | length) == 1 then $include[0] else "{\($include | join(","))}" end ]
                + ($paths | map(select(startswith("!"))))
                + ($ignore | map("!\(.)"));

            { ci: [".github/workflows/**"], any: rules(["**"]) }
            + (map({ key: "project_\(.name)", value: rules(.paths) }) | from_entries)
            + ($extra | with_entries(.key = "extra_\(.key)" | .value = rules(.value | if type == "string" then [.] else . end)))
            + (if ($deps | length) > 0 then { non_dependency: rules(["**"] + ($deps | map("!\(.)"))) } else {} end)
          ' <<<"$projects")

          {
            echo "projects=${projects}"
            echo "filters=${filters}"
          } >> "$GITHUB_OUTPUT"

      # Pull requests are diffed through the API; pushes are diffed in git.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: ${{ steps.normalize.outputs.filters }}

      - name: Select what to run
        id: select
        env:
          PROJECTS: ${{ steps.normalize.outputs.projects }}
          EXTRA_FILTERS: ${{ inputs.extra-filters }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          DEPENDENCY_PATHS: ${{ inputs.dependency-paths }}
        run: |
          has_change() {
            jq -e --arg key "$1" 'any(.[]; . == $key)' <<<"$CHANGES" > /dev/null
          }

          # `all` selects every project; `extra_all` turns every extra filter on.
          case "$EVENT" in
            pull_request)
              if has_change ci; then all=true; else all=false; fi
              extra_all=$all ;;
            push)
              all=true
              extra_all=false ;;
            *)
              all=true
              extra_all=true ;;
          esac

          pick_names() {
            jq -c --arg lang "$1" --argjson all "$all" --argjson changes "$CHANGES" '
              map(select(.language == $lang
                and ($all or ("project_\(.name)" as $key | any($changes[]; . == $key))))
                | .name)
            ' <<<"$PROJECTS"
          }

          node_names=$(pick_names node)
          go_names=$(pick_names go)
          projects_by_name=$(jq -c 'map({ key: .name, value: . }) | from_entries' <<<"$PROJECTS")

          if [ "$all" = "true" ] || has_change any; then any=true; else any=false; fi

          extra=$(jq -c --argjson all "$extra_all" --argjson changes "$CHANGES" '
            with_entries(.key as $name | .value = ($all or any($changes[]; . == "extra_\($name)")))
          ' <<<"$EXTRA_FILTERS")

          dependency_update=false
          if [ "$EVENT" = "push" ]; then
            if jq -e 'length > 0 and all(.[]; .author.username == "dependabot[bot]")' <<<"$COMMITS" > /dev/null; then
              dependency_update=true
            elif jq -e 'length > 0' <<<"$DEPENDENCY_PATHS" > /dev/null \
              && has_change any && ! has_change non_dependency; then
              dependency_update=true
            fi
          fi

          {
            echo "node-names=${node_names}"
            echo "go-names=${go_names}"
            echo "projects-by-name=${projects_by_name}"
            echo "any=${any}"
            echo "extra=${extra}"
            echo "dependency-update=${dependency_update}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Detected changes"
            echo ""
            echo "- Run everything: \`${all}\`"
            echo "- Node projects: \`${node_names}\`"
            echo "- Go projects: \`${go_names}\`"
            echo "- Extra filters: \`${extra}\`"
            echo "- Dependency update: \`${dependency_update}\`"
          } >> "$GITHUB_STEP_SUMMARY"
